name: MSBrossAI CI (no deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-build:
    name: Lint & Build All Apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          # ── Vite apps en raíz ──
          - { name: 'app-generator', path: 'apps/app-generator' }
          - { name: 'combipro', path: 'apps/combipro' }
          - { name: 'edelweiss', path: 'apps/edelweiss' }
          - { name: 'elitescout', path: 'apps/elitescout' }
          - { name: 'gas-station', path: 'apps/gas-station' }
          - { name: 'industrialpro', path: 'apps/industrialpro' }
          - { name: 'logisearch', path: 'apps/logisearch' }
          - { name: 'moko-tools', path: 'apps/moko-tools' }
          - { name: 'taskflow-pro', path: 'apps/taskflow-pro' }
          # ── Apps con frontend/ o client/ ──
          - { name: 'iaputa-os', path: 'apps/iaputa-os/frontend' }
          - { name: 'jartosdto', path: 'apps/jartosdto/client' }
          - { name: 'livekit-nikolina', path: 'apps/livekit-nikolina/frontend' }
          - { name: 'traductor-pro', path: 'apps/traductor-pro/client' }
          # NOTA: cuentos-magicos usa Next.js static export con deploy manual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app.name }}
          path: ${{ matrix.app.path }}/dist
          retention-days: 7

